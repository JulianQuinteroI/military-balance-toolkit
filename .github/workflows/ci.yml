name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sincronizar dependencias
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check src scripts tests

      - name: Tipos
        run: uv run mypy

      # El corpus del IISS no se versiona: la suite usa un corpus sintético y
      # salta sola las pruebas que necesitan el volumen real.
      - name: Tests
        run: uv run pytest -q --cov=mb2026 --cov-report=term
